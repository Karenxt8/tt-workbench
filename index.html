<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  --pink-50:#fff8fc; --pink-100:#fff0f7; --pink-200:#ffe1f0;
  --pink-300:#ffcce4; --pink-400:#ffb0d4; --pink-500:#ff94c0;
  --pink-600:#f06ba6; --plum:#7d5e70; --plum-soft:#a98aa0;
  --mint:#9fdfc6; --shadow:0 10px 30px rgba(240,107,166,.14);
  --radius:22px;
}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',sans-serif;
    color:var(--plum);
    background:linear-gradient(135deg,#fff3f9 0%,#f2f9ff 30%,#f1fff4 60%,#fbf2ff 100%);
    min-height:100vh;overflow:hidden;
  }
  /* floating hearts */
  .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .hearts span{position:absolute;bottom:-40px;font-size:22px;opacity:.5;animation:floatUp linear infinite}
  @keyframes floatUp{to{transform:translateY(-110vh) rotate(360deg);opacity:0}}

  .app{display:flex;height:100vh;height:100dvh;position:relative;z-index:1}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:248px;flex:0 0 248px;padding:22px 16px;
    background:rgba(255,255,255,.55);backdrop-filter:blur(10px);
    border-right:2px solid rgba(255,143,184,.25);
    display:flex;flex-direction:column;gap:6px;overflow-y:auto;
  }
  .logo{display:flex;align-items:center;gap:8px;font-size:22px;color:var(--pink-600);
    padding:4px 8px 14px;text-shadow:0 2px 0 #fff}
  .logo .avatar{font-size:30px;animation:bounce 2.4s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .nav-btn{
    display:flex;align-items:center;gap:12px;width:100%;border:none;cursor:pointer;
    background:transparent;color:var(--plum);font-family:inherit;font-size:16px;
    padding:11px 12px;border-radius:16px;transition:.2s;text-align:left;
  }
  .nav-btn .ico{width:38px;height:38px;flex:0 0 38px;border-radius:50%;
    display:grid;place-items:center;font-size:19px;
    background:linear-gradient(135deg,#fff,#ffe3ef);box-shadow:0 4px 10px rgba(255,111,165,.15)}
  .mobile-nav{display:none}
  .nav-btn:hover{background:rgba(255,179,209,.35);transform:translateX(3px)}
  /* 每个导航图标的马卡龙糖果色 */
  .nav-btn[data-view="home"] .ico{background:linear-gradient(135deg,#fff,#ffe3ef)}
  .nav-btn[data-view="english"] .ico{background:linear-gradient(135deg,#fff,#d8f6e8)}
  .nav-btn[data-view="exercise"] .ico{background:linear-gradient(135deg,#fff,#fff3c6)}
  .nav-btn[data-view="food"] .ico{background:linear-gradient(135deg,#fff,#ffe4d2)}
  .nav-btn[data-view="work"] .ico{background:linear-gradient(135deg,#fff,#e9ddf9)}
  .nav-btn[data-view="media"] .ico{background:linear-gradient(135deg,#fff,#d6eaff)}
  .nav-btn[data-view="korean"] .ico{background:linear-gradient(135deg,#fff,#ffdce8)}
  .nav-btn[data-view="emotion"] .ico{background:linear-gradient(135deg,#fff,#e6f1d2)}
  .nav-btn[data-view="parttime"] .ico{background:linear-gradient(135deg,#fff,#fff0c4)}
  .nav-btn.active{background:linear-gradient(135deg,var(--pink-500),var(--pink-600));color:#fff;
    box-shadow:var(--shadow)}
  .nav-btn.active .ico{background:rgba(255,255,255,.9);box-shadow:none}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px}
  .mini-btn{border:1px dashed var(--pink-300);background:#fff;border-radius:14px;
    padding:8px;cursor:pointer;color:var(--plum-soft);font-family:inherit;font-size:13px}
  .mini-btn:hover{background:var(--pink-100);color:var(--pink-600)}

  /* ---------- Main ---------- */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  header.topbar{
    padding:18px 30px;display:flex;justify-content:space-between;align-items:center;
    background:rgba(255,255,255,.5);backdrop-filter:blur(8px);
    border-bottom:2px solid rgba(255,143,184,.2);
  }
  .greet{font-size:24px;color:var(--pink-600)}
  .greet small{display:block;font-size:13px;color:var(--plum-soft);font-family:'PingFang SC',sans-serif}
  .clock{text-align:right}
  .clock .time{font-size:30px;color:var(--plum);letter-spacing:1px;font-family:'PingFang SC',sans-serif;font-weight:700}
  .clock .date{font-size:13px;color:var(--plum-soft);font-family:'PingFang SC',sans-serif}

  .content{flex:1;overflow-y:auto;padding:26px 30px 40px}
  .view{display:none;animation:fade .35s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .card{background:rgba(255,255,255,.85);border-radius:var(--radius);padding:22px 24px;
    box-shadow:var(--shadow);border:1px solid rgba(255,179,209,.4);margin-bottom:20px}
  .card h2{font-size:22px;color:var(--pink-600);margin-bottom:16px;display:flex;align-items:center;gap:10px}
  .card h2 .tag{font-size:12px;font-family:'PingFang SC',sans-serif;background:var(--pink-100);
    color:var(--plum-soft);padding:3px 10px;border-radius:20px;font-weight:400}

  /* stat row */
  .stat-row{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:18px}
  .stat{flex:1;min-width:120px;background:linear-gradient(135deg,#fff,#fff0f6);
    border-radius:18px;padding:14px;text-align:center;border:1px solid var(--pink-200)}
  .stat .num{display:block;font-size:30px;color:var(--pink-500);line-height:1.1}
  .stat .lbl{font-size:13px;color:var(--plum-soft);font-family:'PingFang SC',sans-serif}

  /* forms */
  .add-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  input,select,textarea{font-family:'PingFang SC',sans-serif;font-size:14px;
    padding:10px 12px;border:2px solid var(--pink-200);border-radius:14px;background:#fff;color:var(--plum);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--pink-400)}
  input{flex:1;min-width:120px}
  textarea{flex:1;width:100%;resize:vertical;min-height:90px}
  .btn{border:none;cursor:pointer;font-family:inherit;font-size:15px;padding:10px 18px;
    border-radius:14px;background:linear-gradient(135deg,var(--pink-500),var(--pink-600));
    color:#fff;box-shadow:0 6px 14px rgba(240,107,166,.3);transition:.15s;white-space:nowrap}
  .btn:hover{transform:translateY(-2px);box-shadow:0 9px 18px rgba(255,111,165,.4)}
  .btn.soft{background:#fff;color:var(--pink-600);border:2px solid var(--pink-300);box-shadow:none}
  .btn.soft:hover{background:var(--pink-100)}
  .btn.tiny{padding:6px 12px;font-size:13px;border-radius:12px}

  /* item list */
  .item-list{list-style:none;display:flex;flex-direction:column;gap:10px;margin:8px 0}
  .item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;
    padding:11px 14px;border:1px solid var(--pink-200)}
  .item .txt{flex:1;font-family:'PingFang SC',sans-serif;font-size:14px;word-break:break-word}
  .item .sub{font-size:12px;color:var(--plum-soft)}
  .item .del{cursor:pointer;border:none;background:var(--pink-100);color:var(--pink-600);
    border-radius:10px;width:30px;height:30px;font-size:15px;transition:.15s}
  .item .del:hover{background:var(--pink-400);color:#fff}
  .empty{text-align:center;color:var(--plum-soft);font-family:'PingFang SC',sans-serif;
    padding:18px;font-size:14px;opacity:.8}
  .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--pink-300);
    cursor:pointer;display:grid;place-items:center;flex:0 0 22px;background:#fff;font-size:14px}
  .chk.done{background:var(--mint);border-color:var(--mint);color:#fff}
  .done-txt{text-decoration:line-through;opacity:.55}

  /* home */
  .home-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
  @media(max-width:900px){.home-grid{grid-template-columns:1fr}}
  .clock-card{background:linear-gradient(135deg,var(--pink-500),var(--pink-600));
    color:#fff;border-radius:var(--radius);padding:26px;text-align:center;box-shadow:var(--shadow)}
  .clock-card .big{font-size:54px;font-family:'PingFang SC',sans-serif;font-weight:800;letter-spacing:2px}
  .clock-card .sm{font-size:15px;opacity:.95;font-family:'PingFang SC',sans-serif;margin-top:4px}
  .checkin-card{display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center}
  .streak{font-size:16px;color:var(--plum-soft);font-family:'PingFang SC',sans-serif}
  .streak b{color:var(--pink-600);font-size:22px}
  .quote-card{background:linear-gradient(135deg,#fff,#fff3f8);text-align:center}
  .quote-card .zh{font-size:26px;color:var(--pink-600);line-height:1.5}
  .quote-card .en{font-size:15px;color:var(--plum-soft);font-family:'PingFang SC',sans-serif;
    margin-top:10px;font-style:italic}
  .mini-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:6px}
  .mini{background:#fff;border-radius:16px;padding:13px;text-align:center;border:1px solid var(--pink-200)}
  .mini .n{font-size:24px;color:var(--pink-500)}
  .mini .t{font-size:12px;color:var(--plum-soft);font-family:'PingFang SC',sans-serif}

  .meals{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .meal{flex:1;min-width:90px;text-align:center;padding:12px;border-radius:16px;cursor:pointer;
    background:#fff;border:2px solid var(--pink-200);font-family:'PingFang SC',sans-serif;font-size:14px;transition:.15s}
  .meal.on{background:linear-gradient(135deg,var(--pink-400),var(--pink-500));color:#fff;border-color:transparent}
  .water-ctrl{display:flex;align-items:center;gap:14px;font-family:'PingFang SC',sans-serif}
  .water-ctrl .cups{font-size:22px;color:var(--pink-500)}
  .reset-zone{margin-top:6px;display:flex;justify-content:flex-end}
  .emotion-hint{font-family:'PingFang SC',sans-serif;font-size:13px;color:var(--plum-soft);
    background:var(--pink-100);padding:10px 14px;border-radius:14px;margin-bottom:12px;line-height:1.6}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--plum);color:#fff;padding:12px 22px;border-radius:30px;font-family:'PingFang SC',sans-serif;
    font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:99;box-shadow:0 8px 20px rgba(0,0,0,.2)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .stage-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-family:'PingFang SC',sans-serif;font-size:14px;color:var(--plum-soft)}
  .stage-btns{display:flex;gap:8px;flex-wrap:wrap}
  .stage-btn{border:2px solid var(--pink-200);background:#fff;color:var(--plum);font-family:inherit;font-size:14px;padding:7px 14px;border-radius:14px;cursor:pointer;transition:.15s}
  .stage-btn:hover{background:var(--pink-100)}
  .stage-btn.on{background:linear-gradient(135deg,var(--pink-400),var(--pink-500));color:#fff;border-color:transparent}
  .stage-progress{font-family:'PingFang SC',sans-serif;font-size:13px;color:var(--plum-soft);background:var(--pink-100);padding:10px 14px;border-radius:14px;margin-bottom:10px;line-height:1.9}
  .stage-progress b{color:var(--pink-600)}
  .food-hint{font-family:'PingFang SC',sans-serif;font-size:13px;color:var(--plum-soft);min-height:20px;margin:6px 0 12px}
  .stage-tag{display:inline-block;font-size:11px;background:var(--pink-200);color:var(--pink-600);padding:1px 8px;border-radius:10px;margin-left:6px;font-family:'PingFang SC',sans-serif}
  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-thumb{background:var(--pink-300);border-radius:10px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ============ 移动端适配（手机） ============ */
  @media (max-width:768px){
    .app{flex-direction:column;height:100dvh;overflow-y:auto}
    .sidebar{display:none}
    .main{flex:0 0 auto;overflow:visible}
    header.topbar{flex-wrap:wrap;padding:12px 16px;position:sticky;top:0;z-index:10;
      background:rgba(255,255,255,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      border-bottom:2px solid rgba(255,143,184,.2)}
    .greet{cursor:pointer}
    .greet{font-size:18px}
    .greet small{font-size:11px}
    .clock .time{font-size:22px}
    .clock .date{font-size:11px}
    .mobile-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex-basis:100%;margin-top:12px}
    .mn-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;
      border:1px solid var(--pink-200);border-radius:16px;padding:10px 4px;font-size:12px;color:var(--plum);
      font-family:inherit;cursor:pointer;transition:.15s}
    .mn-btn .ico{font-size:18px}
    .mn-btn.active{background:linear-gradient(135deg,var(--pink-400),var(--pink-500));color:#fff;border-color:transparent}
    .mn-btn:active{transform:scale(.96)}
    .content{padding:16px 14px 28px;overflow-y:visible}
    .card{padding:16px 16px}
    .card h2{font-size:19px}
    .stat-row{gap:10px}
    .stat{flex:1 1 40%;min-width:0;padding:10px}
    .stat .num{font-size:22px}
    .home-grid{grid-template-columns:1fr}
    .clock-card{display:none}
    .clock-card .big{font-size:38px}
    .mini-stats{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
    .add-row{flex-direction:column}
    .add-row input,.add-row select{flex:1 1 auto;width:100%}
    .add-row .btn{width:100%}
    .meals{gap:6px}
    .meal{flex:1 0 22%;font-size:12px;padding:10px 2px}
    .water-ctrl{flex-wrap:wrap}
    .stage-bar{align-items:flex-start;flex-direction:column}
    .stage-btns{width:100%}
    .stage-btn{flex:1 1 auto;text-align:center}
  }
  @media (max-width:768px) and (max-height:720px){
    .greet small{display:none}
    .clock-card .sm{font-size:13px}
  }
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo"><span class="avatar">🐰</span><span>Tt的工作台</span></div>
    <button class="nav-btn active" data-view="home"><span class="ico">🏠</span>我的桌面</button>
    <button class="nav-btn" data-view="english"><span class="ico">📚</span>英语学习</button>
    <button class="nav-btn" data-view="exercise"><span class="ico">🏃</span>锻炼身体</button>
    <button class="nav-btn" data-view="food"><span class="ico">🍱</span>好好吃饭</button>
    <button class="nav-btn" data-view="work"><span class="ico">📝</span>工作安排</button>
    <button class="nav-btn" data-view="media"><span class="ico">📸</span>自媒体计划</button>
    <button class="nav-btn" data-view="korean"><span class="ico">🇰🇷</span>韩语学习</button>
    <button class="nav-btn" data-view="emotion"><span class="ico">🗑️</span>情绪垃圾桶</button>
    <button class="nav-btn" data-view="parttime"><span class="ico">💰</span>兼职记录</button>
    <div class="side-foot">
      <button class="mini-btn" onclick="exportData()">💾 备份数据</button>
      <button class="mini-btn" onclick="importData()">📂 恢复数据</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="doImport(event)">
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <div class="greet" id="greet" onclick="switchView('home')">早安，今天也要加油鸭 🐰<small id="greetSub">点我回首页 · 专属你的工作台</small></div>
      <div class="clock">
        <div class="time" id="clockTime">--:--:--</div>
        <div class="date" id="clockDate">加载中…</div>
      </div>
      <div class="mobile-nav" id="mobileNav"></div>
    </header>
    <div class="content">
      <!-- HOME -->
      <section class="view active" id="view-home"></section>
      <!-- ENGLISH -->
      <section class="view" id="view-english"></section>
      <!-- EXERCISE -->
      <section class="view" id="view-exercise"></section>
      <!-- FOOD -->
      <section class="view" id="view-food"></section>
      <!-- WORK -->
      <section class="view" id="view-work"></section>
      <!-- MEDIA -->
      <section class="view" id="view-media"></section>
      <!-- KOREAN -->
      <section class="view" id="view-korean"></section>
      <!-- EMOTION -->
      <section class="view" id="view-emotion"></section>
      <section class="view" id="view-parttime"></section>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ 数据存储（全部本地 localStorage） ============ */
const STORE_KEY = 'my_cute_workbench_v1';
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function todayKey(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${da}`;}

function freshDaily(){return{
  english:{words:[],listen:0},
  exercise:{logs:[]},
  food:{meals:{breakfast:false,lunch:false,dinner:false,snack:false},water:0,foods:[]},
  korean:{classes:0,classLog:[]}
};}
function defaultState(){return{
  checkins:[],
  daily:{},
  koreanStage:'发音课',
  total:{englishWords:0,englishListen:0,exerciseMin:0,water:0,kcal:0,koreanClasses:0,koreanHW:0,koreanByStage:{发音课:0,'TOPIK 1':0,'TOPIK 2':0,'TOPIK 3':0,'TOPIK 4':0,其他:0},koreanHWByStage:{发音课:0,'TOPIK 1':0,'TOPIK 2':0,'TOPIK 3':0,'TOPIK 4':0,其他:0}},
  lists:{workTasks:[],mediaPosts:[],mediaIdeas:[],emotionEntries:[],koreanHW:[],parttime:[]}
};}
let state = normalize(load()||defaultState());
function normalize(s){const d=defaultState();s.checkins=s.checkins||[];s.daily=s.daily||{};s.total=Object.assign(d.total,s.total||{});s.lists=Object.assign(d.lists,s.lists||{});if(!s.koreanStage)s.koreanStage='发音课';const stageMap={'TOPIK':'TOPIK 1','TOPIK I':'TOPIK 1','TOPIK II':'TOPIK 2'};if(s.koreanStage in stageMap)s.koreanStage=stageMap[s.koreanStage];const bs=s.total.koreanByStage,hs=s.total.koreanHWByStage;const migrate=o=>{if(!o)return;for(const[k,v]of Object.entries(stageMap)){if(k in o){o[v]=(o[v]||0)+(o[k]||0);delete o[k];}}};migrate(bs);migrate(hs);(s.lists.koreanHW||[]).forEach(h=>{if(h.stage in stageMap)h.stage=stageMap[h.stage];});Object.values(s.daily).forEach(dy=>{if(dy.korean&&dy.korean.classLog)dy.korean.classLog.forEach(c=>{if(c.stage in stageMap)c.stage=stageMap[c.stage];});});return s;}
function load(){try{return JSON.parse(localStorage.getItem(STORE_KEY));}catch(e){return null;}}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state));}
function getToday(){const k=todayKey();if(!state.daily[k])state.daily[k]=freshDaily();return state.daily[k];}

function dayOfYear(d){const s=new Date(d.getFullYear(),0,0);return Math.floor((d-s)/86400000);}
function todayQuote(){return QUOTES[dayOfYear(new Date())%QUOTES.length];}

/* ============ 时钟 & 问候 ============ */
function tick(){
  const d=new Date();
  $('#clockTime').textContent=d.toLocaleTimeString('zh-CN',{hour12:false});
  $('#clockDate').textContent=d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  const h=d.getHours();
  const g=h<11?'早安':h<18?'午安':'晚安';
  $('#greet').firstChild.textContent=`${g}，今天也要加油鸭 🐰`;
}
function streak(){
  if(!state.checkins.length)return 0;
  const set=new Set(state.checkins);
  let d=new Date();
  if(!set.has(todayKey(d))){d.setDate(d.getDate()-1);if(!set.has(todayKey(d)))return 0;}
  let s=0;while(set.has(todayKey(d))){s++;d.setDate(d.getDate()-1);}
  return s;
}

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);}

  $('#mobileNav').innerHTML=MOBILE_NAV.map(([v,ic,lb])=>`<button class="mn-btn ${v===currentView?'active':''}" data-view="${v}" onclick="switchView('${v}')"><span class="ico">${ic}</span><span>${lb}</span></button>`).join('');

function switchView(v){
  currentView=v;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  document.querySelectorAll('.mn-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
  $('#view-'+v).classList.add('active');
  render(v);
}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));

function render(v){

  const t=getToday();

    {n:t.english.words.length,t:'今日单词'},
    {n:t.exercise.logs.reduce((a,b)=>a+b.min,0)+'′',t:'运动时长'},
    {n:t.food.water,t:'喝水(杯)'},
    {n:(t.food.foods||[]).reduce((a,b)=>a+(b.kcal||0),0)+'kcal',t:'今日热量'},
    {n:mealsDone+'/4',t:'三餐打卡'},
    {n:done+'/'+wt.length,t:'工作任务'},
    {n:state.lists.mediaIdeas.length,t:'灵感数'},
    {n:(t.korean.classes||0)+'节',t:'韩语上课'},
    {n:state.lists.emotionEntries.length,t:'情绪释放'},
    {n:state.lists.parttime.length+'条',t:'兼职记录'}

}

function matchFood(name){name=name.toLowerCase();let best=null;for(const k in FOOD_DB){const kk=k.toLowerCase();if(name.includes(kk)||kk.includes(name)){if(!best||k.length>best.length)best=k;}}return best;}
function foodAutoFill(){const name=$('#fdName').value.trim();const hint=$('#fdHint');if(!name){hint.textContent='';$('#fdKcal').value='';return;}const k=matchFood(name);if(k){hint.textContent='📊 '+k+' ≈ '+FOOD_DB[k]+' kcal/100g（已帮你估算，可修改）';$('#fdKcal').value=FOOD_DB[k];}else{hint.textContent='🔍 没查到「'+name+'」，请手动填写热量(kcal)';$('#fdKcal').value='';}}
function foodAdd(){const name=$('#fdName').value.trim();const kcal=parseInt($('#fdKcal').value);if(!name){toast('先写个食物名～');return;}if(!kcal||kcal<=0){toast('请填写热量(kcal)，没查到就手动填哦');return;}getToday().food.foods.push({id:uid(),name,kcal});state.total.kcal=(state.total.kcal||0)+kcal;$('#fdName').value='';$('#fdKcal').value='';$('#fdHint').textContent='';save();renderFood();}
function foodDel(id){const t=getToday();const f=t.food.foods.find(x=>x.id===id);if(f)state.total.kcal=Math.max(0,(state.total.kcal||0)-f.kcal);t.food.foods=t.food.foods.filter(x=>x.id!==id);save();renderFood();}
function toggleMeal(k){getToday().food.meals[k]=!getToday().food.meals[k];save();renderFood();}
function water(d){const t=getToday();t.food.water=Math.max(0,t.food.water+d);if(d>0)state.total.water+=d;save();renderFood();}

function wkAdd(){const v=$('#wkText').value.trim();if(!v){toast('写点什么吧～');return;}state.lists.workTasks.push({id:uid(),text:v,done:false});$('#wkText').value='';save();renderWork();}
function toggleTask(id){const x=state.lists.workTasks.find(t=>t.id===id);x.done=!x.done;save();renderWork();}
function delTask(id){state.lists.workTasks=state.lists.workTasks.filter(t=>t.id!==id);save();renderWork();}

function renderMedia(){
  const ideas=state.lists.mediaIdeas, posts=state.lists.mediaPosts;
  const ideaHtml=ideas.map(x=>`<li class="item"><span class="txt">💡 ${esc(x.text)}</span><button class="del" onclick="delIdea('${x.id}')">✕</button></li>`).join('')||`<div class="empty">灵感一闪而过，赶紧记下来 💡</div>`;
  const postHtml=posts.map(x=>`<li class="item"><div class="chk ${x.done?'done':''}" onclick="togglePost('${x.id}')">${x.done?'✓':''}</div><span class="txt ${x.done?'done-txt':''}"><b>${esc(x.platform)}</b> · ${esc(x.text)}</span><button class="del" onclick="delPost('${x.id}')">✕</button></li>`).join('')||`<div class="empty">还没有发布计划，安排上！📸</div>`;
  $('#view-media').innerHTML=`
   <div class="card">
     <h2>📸 自媒体计划 <span class="tag">累积记录</span></h2>
     <div class="stat-row">
       <div class="stat"><span class="num">${ideas.length}</span><span class="lbl">灵感数</span></div>
       <div class="stat"><span class="num">${posts.filter(p=>!p.done).length}</span><span class="lbl">待发布</span></div>
       <div class="stat"><span class="num">${posts.filter(p=>p.done).length}</span><span class="lbl">已发布</span></div>
     </div>
     <h2 style="font-size:17px;margin-top:6px">💡 内容灵感</h2>
     <div class="add-row"><input id="mdIdea" placeholder="突然想到的好点子…" onkeydown="if(event.key==='Enter')addIdea()"><button class="btn" onclick="addIdea()">＋ 记录</button></div>
     <ul class="item-list">${ideaHtml}</ul>
     <h2 style="font-size:17px;margin-top:10px">📅 发布计划</h2>
     <div class="add-row">
       <select id="mdPlat"><option>小红书</option><option>抖音</option><option>微信公众号</option><option>B站</option><option>微博</option><option>其他</option></select>
       <input id="mdText" placeholder="这期发什么？" onkeydown="if(event.key==='Enter')addPost()">
       <button class="btn" onclick="addPost()">＋ 添加</button>
     </div>
     <ul class="item-list">${postHtml}</ul>
   </div>`;
}
function addIdea(){const v=$('#mdIdea').value.trim();if(!v){toast('先写点灵感～');return;}state.lists.mediaIdeas.push({id:uid(),text:v});$('#mdIdea').value='';save();renderMedia();}
function delIdea(id){state.lists.mediaIdeas=state.lists.mediaIdeas.filter(x=>x.id!==id);save();renderMedia();}
function addPost(){const v=$('#mdText').value.trim();if(!v){toast('写下发什么吧～');return;}state.lists.mediaPosts.push({id:uid(),platform:$('#mdPlat').value,text:v,done:false});$('#mdText').value='';save();renderMedia();}
function togglePost(id){const x=state.lists.mediaPosts.find(p=>p.id===id);x.done=!x.done;save();renderMedia();}
function delPost(id){state.lists.mediaPosts=state.lists.mediaPosts.filter(p=>p.id!==id);save();renderMedia();}

function renderKorean(){
  const t=getToday();
  const hw=state.lists.koreanHW;
  const hwDone=hw.filter(x=>x.done).length;
  const stage=state.koreanStage;
  const stageBtns=KR_STAGES.map(s=>`<button class="stage-btn ${s===stage?'on':''}" onclick="setStage('${s}')">${s.startsWith('TOPIK')?'📄 ':s==='发音课'?'🔤 ':'✨ '}${s}</button>`).join('');
  const stageProg=KR_STAGES.map(s=>`<b>${s}</b>：上课 ${state.total.koreanByStage[s]||0} 节 · 作业 ${state.total.koreanHWByStage[s]||0} 项`).join('　｜　');
  const classLog=t.korean.classLog.map(c=>`<li class="item"><span class="txt">📖 ${esc(c.note||'韩语课')}<span class="stage-tag">${esc(c.stage||'')}</span><br><span class="sub">${c.time}</span></span><button class="del" onclick="krDelClass('${c.id}')">✕</button></li>`).join('')||`<div class="empty">还没有上课记录，去打卡第一节课吧 🇰🇷</div>`;
  const hwList=hw.map(x=>`<li class="item"><div class="chk ${x.done?'done':''}" onclick="krHWToggle('${x.id}')">${x.done?'✓':''}</div><span class="txt ${x.done?'done-txt':''}">${esc(x.text)}<span class="stage-tag">${esc(x.stage||'')}</span></span><button class="del" onclick="krHWDel('${x.id}')">✕</button></li>`).join('')||`<div class="empty">还没有作业，加一项试试 📝</div>`;
  $('#view-korean').innerHTML=`
   <div class="card">
     <h2>🇰🇷 韩语学习 <span class="tag">课程模式 · 上课 + 作业</span></h2>
     <div class="stat-row">
       <div class="stat"><span class="num">${t.korean.classes}</span><span class="lbl">今日上课(节)</span></div>
       <div class="stat"><span class="num">${state.total.koreanClasses}</span><span class="lbl">累计上课(节)</span></div>
       <div class="stat"><span class="num">${hwDone}/${hw.length}</span><span class="lbl">作业进度</span></div>
       <div class="stat"><span class="num">${state.total.koreanHW}</span><span class="lbl">累计完成作业</span></div>
     </div>

     <div class="stage-bar"><span>当前阶段：</span><div class="stage-btns">${stageBtns}</div></div>
     <div class="stage-progress">${stageProg}</div>

     <h2 style="font-size:17px;margin-top:4px">📖 上课打卡 <span class="tag">归属「${stage}」</span></h2>
     <div class="add-row">
       <input id="krNote" placeholder="这节课内容，如 单元1 发音练习">
       <button class="btn" onclick="krClass()">✓ 上课打卡</button>
     </div>
     <ul class="item-list">${classLog}</ul>

     <h2 style="font-size:17px;margin-top:10px">📝 作业清单 <span class="tag">归属「${stage}」</span></h2>
     <div class="add-row"><input id="krHW" placeholder="今天要完成的作业…" onkeydown="if(event.key==='Enter')krHWAdd()"><button class="btn" onclick="krHWAdd()">＋ 添加</button></div>
     <ul class="item-list">${hwList}</ul>

     <div class="reset-zone"><button class="btn soft" onclick="resetToday('korean')">🧹 重置今日(上课记录)</button></div>
   </div>`;
}
function setStage(s){state.koreanStage=s;save();renderKorean();}
function krClass(){const note=$('#krNote').value.trim();const stage=state.koreanStage;if(!(stage in state.total.koreanByStage))state.total.koreanByStage[stage]=0;getToday().korean.classes++;getToday().korean.classLog.push({id:uid(),note,stage,time:new Date().toLocaleString('zh-CN',{hour12:false})});state.total.koreanClasses++;state.total.koreanByStage[stage]++;$('#krNote').value='';save();renderKorean();toast('上课打卡成功，认真听讲哦 📖');}
function krDelClass(id){const t=getToday();const c=t.korean.classLog.find(x=>x.id===id);t.korean.classLog=t.korean.classLog.filter(x=>x.id!==id);t.korean.classes=Math.max(0,t.korean.classes-1);if(c){state.total.koreanClasses=Math.max(0,state.total.koreanClasses-1);if(c.stage in state.total.koreanByStage)state.total.koreanByStage[c.stage]=Math.max(0,state.total.koreanByStage[c.stage]-1);}save();renderKorean();}
function krHWAdd(){const v=$('#krHW').value.trim();if(!v){toast('写点作业内容吧～');return;}state.lists.koreanHW.push({id:uid(),text:v,done:false,stage:state.koreanStage});$('#krHW').value='';save();renderKorean();}
function krHWToggle(id){const x=state.lists.koreanHW.find(h=>h.id===id);const was=x.done;x.done=!x.done;if(!was&&x.done){state.total.koreanHW++;const s=x.stage;if(!(s in state.total.koreanHWByStage))state.total.koreanHWByStage[s]=0;state.total.koreanHWByStage[s]++;}save();renderKorean();}
function krHWDel(id){const x=state.lists.koreanHW.find(h=>h.id===id);if(x&&x.done){state.total.koreanHW=Math.max(0,state.total.koreanHW-1);if(x.stage in state.total.koreanHWByStage)state.total.koreanHWByStage[x.stage]=Math.max(0,state.total.koreanHWByStage[x.stage]-1);}state.lists.koreanHW=state.lists.koreanHW.filter(h=>h.id!==id);save();renderKorean();}

function renderEmotion(){
  const e=state.lists.emotionEntries;
  const list=e.slice().reverse().map(x=>`<li class="item"><span class="txt">${esc(x.text)}<br><span class="sub">${x.time}</span></span><button class="del" onclick="delEmo('${x.id}')">✕</button></li>`).join('')||`<div class="empty">垃圾桶空空的，心情不错呀 🌈</div>`;
  $('#view-emotion').innerHTML=`
   <div class="card">
     <h2>🗑️ 情绪垃圾桶 <span class="tag">说出来就好</span></h2>
     <div class="emotion-hint">💗 这里没有评判，只有倾听。把不开心、委屈、烦躁统统丢进来，写完就轻松一点啦。删掉也没关系，情绪来去都自由。</div>
     <div class="add-row"><textarea id="emoText" placeholder="今天有什么想吐槽的？写出来就舒畅了…"></textarea></div>
     <div style="display:flex;gap:10px;justify-content:flex-end">
       <button class="btn soft" onclick="clearEmo()">🧹 清空垃圾桶</button>
       <button class="btn" onclick="addEmo()">丢进去 🗑️</button>
     </div>
     <ul class="item-list" style="margin-top:16px">${list}</ul>
     <div class="streak" style="text-align:center">已释放情绪 <b>${e.length}</b> 次，你辛苦了 💛</div>
   </div>`;
}
function addEmo(){const v=$('#emoText').value.trim();if(!v){toast('写点什么再丢呀～');return;}const d=new Date();state.lists.emotionEntries.push({id:uid(),text:v,time:d.toLocaleString('zh-CN',{hour12:false})});$('#emoText').value='';save();renderEmotion();toast('已丢进垃圾桶，轻松一点啦 💛');}
function delEmo(id){state.lists.emotionEntries=state.lists.emotionEntries.filter(x=>x.id!==id);save();renderEmotion();}
function clearEmo(){if(!state.lists.emotionEntries.length){toast('本来就是空的哦');return;}if(confirm('确定要清空整个情绪垃圾桶吗？这一刻的委屈就让它过去吧。')){state.lists.emotionEntries=[];save();renderEmotion();toast('清空啦，新的一天轻装上阵 🌈');}}

/* ============ 重置今日 ============ */
function resetToday(sec){
  const labels={english:'英语学习',exercise:'锻炼身体',food:'好好吃饭',korean:'韩语学习'};
  if(!confirm(`确定重置「${labels[sec]}」的今日数据吗？\n（累计数据会保留，今日记录清空）`))return;
  state.daily[todayKey()]=freshDaily();
  // 仅清空对应模块当日数据：重建时保留其他模块
  const fresh=freshDaily();
  const cur=state.daily[todayKey()];
  if(sec==='english'){cur.english=fresh.english;}
  if(sec==='exercise'){cur.exercise=fresh.exercise;}
  if(sec==='food'){cur.food=fresh.food;}
  if(sec==='korean'){cur.korean=fresh.korean;}
  save();render(sec);toast('今日已重置，重新出发 🌸');
}
function clearDone(sec){
  if(sec==='work'){state.lists.workTasks=state.lists.workTasks.filter(t=>!t.done);save();renderWork();toast('已完成任务已清除');}
  if(sec==='parttime'){if(!state.lists.parttime.length){toast('本来就是空的哦');return;}if(confirm('确定清空所有兼职记录吗？')){state.lists.parttime=[];save();renderParttime();toast('已清空兼职记录');}}
}

/* ============ 备份 / 恢复 ============ */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='Tt的工作台-备份-'+todayKey()+'.json';a.click();
  toast('数据已备份到本地 💾');
}
function importData(){$('#importFile').click();}
function doImport(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);state=Object.assign(defaultState(),d);save();switchView('home');toast('数据已恢复 📂');}catch(err){toast('文件格式不对哦');}};
  r.readAsText(f);e.target.value='';
}

/* ============ 兼职记录 ============ */
function renderParttime(){
  const list=state.lists.parttime;
  const sum=t=>list.filter(x=>x.type===t).reduce((a,b)=>a+(b.amount||0),0);
  const total=list.reduce((a,b)=>a+(b.amount||0),0);
  const tut=sum('家教'),vlog=sum('拍摄vlog');
  const items=list.slice().reverse().map(x=>`<li class="item"><span class="txt"><span class="stage-tag">${esc(x.type)}</span> ${esc(x.note||'')}<br><span class="sub">¥${x.amount} · ${x.time}</span></span><button class="del" onclick="ptDel('${x.id}')">✕</button></li>`).join('')||`<div class="empty">还没有兼职记录，赚第一桶金吧 💰</div>`;
  $('#view-parttime').innerHTML=`
   <div class="card">
     <h2>💰 兼职记录 <span class="tag">累积记录</span></h2>
     <div class="stat-row">
       <div class="stat"><span class="num">${list.length}</span><span class="lbl">总记录</span></div>
       <div class="stat"><span class="num">¥${total}</span><span class="lbl">累计收入</span></div>
       <div class="stat"><span class="num">¥${tut}</span><span class="lbl">家教收入</span></div>
       <div class="stat"><span class="num">¥${vlog}</span><span class="lbl">拍摄vlog收入</span></div>
     </div>
     <div class="add-row">
       <select id="ptType"><option>家教</option><option>拍摄vlog</option><option>其他</option></select>
       <input id="ptAmount" type="number" min="0" placeholder="收入金额(¥)" style="max-width:150px">
       <input id="ptNote" placeholder="备注，如 高三数学 / 探店视频">
       <button class="btn" onclick="ptAdd()">＋ 记录</button>
     </div>
     <ul class="item-list">${items}</ul>
     <div class="reset-zone"><button class="btn soft" onclick="clearDone('parttime')">🧹 清空记录</button></div>
   </div>`;
}
function ptAdd(){const type=$('#ptType').value;const amount=parseFloat($('#ptAmount').value);if(isNaN(amount)||!(amount>=0)){toast('填一下收入金额吧～');return;}const note=$('#ptNote').value.trim();state.lists.parttime.push({id:uid(),type,note,amount,time:new Date().toLocaleString('zh-CN',{hour12:false})});$('#ptAmount').value='';$('#ptNote').value='';save();renderParttime();}
function ptDel(id){state.lists.parttime=state.lists.parttime.filter(x=>x.id!==id);save();renderParttime();}

/* ============ 浮动爱心背景 ============ */
function makeHearts(){
  const box=$('#hearts');const emo=['💗','🌸','💕','🩷','✨','🐰'];
  for(let i=0;i<14;i++){const s=document.createElement('span');s.textContent=emo[Math.floor(Math.random()*emo.length)];
    s.style.left=Math.random()*100+'%';s.style.fontSize=(14+Math.random()*18)+'px';
    s.style.animationDuration=(10+Math.random()*12)+'s';s.style.animationDelay=(-Math.random()*15)+'s';box.appendChild(s);}
}

/* ============ 初始化 ============ */
buildMobileNav();
makeHearts();
tick();setInterval(tick,1000);
renderHome();
</script>
